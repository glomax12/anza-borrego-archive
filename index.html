.banner{background:#fff6d8;border-bottom:1px solid #ecd99a;padding:8px 24px;font-size:.85rem;color:#6b5513}
.searchwrap{position:relative;max-width:760px;margin:18px auto 6px;padding:0 16px}

.hint{max-width:760px;margin:0 auto;padding:0 18px;color:var(--muted);font-size:.85rem;min-height:1.3em}
.hint a{color:var(--accent);cursor:pointer;font-weight:600}
main{display:grid;grid-template-columns:270px 1fr;gap:20px;padding:12px 24px 40px;max-width:1400px;margin:0 auto}
aside{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;align-self:start;position:sticky;top:10px;font-size:.88rem}

label.chk{display:flex;gap:6px;align-items:center;margin:4px 0;cursor:pointer}
.reset{margin-top:10px;background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font-weight:600}
.count{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.card .im{aspect-ratio:3/2;background-size:cover;background-position:center;position:relative}
.badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;padding:3px 7px;border-radius:10px}

.pcard .im{display:flex;align-items:flex-end}.pcard .pl{background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;width:100%;padding:28px 12px 10px;font-weight:650}
.back{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;margin-bottom:10px}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}

function results(dom){const qn=norm(q.value),cons=document.getElementById("fcons").checked;
  return D.occurrences.map(o=>[o,score(o,qn)]).filter(([o,s])=>s>0&&(!dom||o.domain==dom)&&(!month||o.month==month)&&(place===null||placeOf(o)==place)&&(!part||o.subjectPart==part)&&(!cons||o.conservationStatus)).sort((a,b)=>b[1]-a[1]||a[0].eventDate.localeCompare(b[0].eventDate)).map(x=>x[0]);}
function fmtDate(o){const d=new Date(o.eventDate.slice(0,10)+"T12:00:00");return d.toLocaleDateString(L=="es"?"es-MX":"en-US",{year:"numeric",month:"long",day:"numeric"})}
const card=o=>{const u=UI[L];return `<div class="card" data-id="${o.occurrenceID}"><div class="im" style="background-image:url(${D.images[o.mids[0]]})">
   ${o.mids.length>1?`<span class="badge">${u.photos(o.mids.length)}</span>`:""}${o.conservationStatus?`<span class="cons">${L=="es"?"Conservación":"Conservation"}</span>`:""}</div>
   <div class="tx"><div class="cn">${cn(o)}${o.individualCount>1?" ×"+o.individualCount:""}</div><div class="sn" style="${o.acceptedNameUsage?"":"font-style:normal"}">${o.acceptedNameUsage||(L=="es"?o.category_es:o.category_en)}</div><div class="dt">${o.domain=="flora"?(L=="es"?o.subjectPart_es:o.subjectPart)+" · ":""}${fmtDate(o)}</div></div></div>`};
const placeOf=o=>o.locationSensitivity=="withhold location"?"__withheld":(o.localityDetail||"");
const placeLab=(k,u)=>k=="__withheld"?u.withheldGrp:(k||u.noLoc);
function render(){const u=UI[L],qn=norm(q.value),G=document.getElementById("grid");
  const per={};DOMS.forEach(t=>per[t]=results(t));const ALL=results(null);
  document.getElementById("tabs").innerHTML=TABS.map(t=>{const n=per[t].length;
    return `<button data-t="${t}" class="${t==tab?"on":""}">${u.tabs[t]}<span class="n ${n?"":"z"}">${n}</span></button>`}).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  const hint=document.getElementById("hint");hint.innerHTML="";
  let R=per[tab], html="";
  {
    html=R.length?`<div class="grid">${R.map(card).join("")}</div>`:"";
    if(tab=="flora"){
      if(!R.length&&!qn)html=`<div class="empty"><h3>${u.emFlora}</h3>${u.emFlora2}</div>`;
    }
    if(tab=="geology"&&!R.length&&!qn)html=`<div class="empty"><h3>${u.emGeo}</h3>${u.emGeo2}</div>`;
    if(tab=="places"&&!R.length&&!qn)html=`<div class="empty">${u.emAny}</div>`;
    if(tab=="built"&&!R.length&&!qn)html=`<div class="empty"><h3>${u.emBuilt}</h3>${u.emBuilt2}</div>`;
    if(!R.length&&qn&&!html){const other=DOMS.filter(t=>t!=tab&&per[t].length);
      if(other.length)hint.innerHTML=`${u.also} `+other.map(t=>`<a data-t="${t}">${u.tabCount(per[t].length,u.tabs[t])}</a>`).join(" · ");
      else{const s=suggest(qn);hint.innerHTML=s?`${u.dym} <a id="dym">${s.label}</a>?`:u.none;if(s)document.getElementById("dym").onclick=()=>setQ(s.query)}
      html=`<div class="empty">${tab=="fauna"?u.emFauna:u.emAny}</div>`;}
  }
  document.getElementById("count").textContent=u.records(R.length)+" · "+u.photos(R.reduce((a,o)=>a+o.mids.length,0));
  G.innerHTML=html; hint.querySelectorAll("a[data-t]").forEach(a=>a.onclick=()=>{tab=a.dataset.t;place=null;tree();render()});
  G.querySelectorAll(".card[data-id]").forEach(c=>c.onclick=()=>openRec(c.dataset.id));
  G.querySelectorAll(".card[data-p]").forEach(c=>c.onclick=()=>{place=c.dataset.p;render()});
  G.querySelectorAll(".card[data-a]").forEach(c=>c.onclick=()=>{q.value=c.dataset.a;tab="fauna";tree();render()});
  const bk=document.getElementById("back");if(bk)bk.onclick=()=>{place=null;render()};
  const pool=D.occurrences.filter(o=>o.domain==tab);
  const mb=document.getElementById("months");const has=new Set(pool.map(o=>o.month));
  mb.innerHTML=u.months.map((m,i)=>`<button data-m="${i+1}" class="${has.has(i+1)?"has":""} ${month==i+1?"on":""}" ${has.has(i+1)?"":"disabled"}>${m}</button>`).join("");
  mb.querySelectorAll("button").forEach(b=>b.onclick=()=>{const m=+b.dataset.m;month=month==m?null:m;render()});
  const P={};pool.forEach(o=>P[o.subjectPart]=L=="es"?o.subjectPart_es:o.subjectPart);const pk=Object.keys(P);
  document.getElementById("partbox").style.display=pk.length>1?"block":"none";
  const PL={};pool.forEach(o=>{const k=placeOf(o);PL[k]=(PL[k]||0)+1});const rk=k=>k==""?2:k=="__withheld"?1:0;
  const plk=Object.keys(PL).sort((a,b)=>rk(a)-rk(b)||a.localeCompare(b));
  document.getElementById("placebox").style.display=plk.some(k=>k&&k!="__withheld")?"block":"none";
  const pf=document.getElementById("placesF");pf.innerHTML=plk.map(k=>`<button data-pl="${k}" class="has ${place===k?"on":""}" style="text-align:left;padding:5px 8px">${placeLab(k,u)} (${PL[k]})</button>`).join("");
  pf.querySelectorAll("button").forEach(b=>b.onclick=()=>{place=place===b.dataset.pl?null:b.dataset.pl;render()});
  const pb=document.getElementById("parts");pb.innerHTML=pk.map(k=>`<button data-p="${k}" class="has ${part==k?"on":""}">${P[k]}</button>`).join("");
  pb.querySelectorAll("button").forEach(b=>b.onclick=()=>{part=part==b.dataset.p?null:b.dataset.p;render()});}
function tree(){const el=document.getElementById("tree");const pool=D.occurrences.filter(o=>o.domain==tab);
  if(!pool.length){el.innerHTML=`<span style="color:var(--muted)">—</span>`;return}
  const T={};pool.forEach(o=>{let path;
    if(o.acceptedNameUsage){path=[o.class,o.order,o.family].filter(Boolean).map(x=>({k:x,q:x,lab:hl(x,L)||x,sci:x}));if(o.acceptedNameUsage!=o.family)path.push({k:o.acceptedNameUsage,q:o.acceptedNameUsage,lab:cn(o),sci:o.acceptedNameUsage,leaf:1})}
    else{const c=L=="es"?o.category_es:o.category_en;path=[{k:"c:"+o.category_en,q:o.category_en,lab:c,sci:c},{k:o.occurrenceID,q:o.vernacularName_en,lab:cn(o),sci:cn(o),leaf:1}]}
    let n=T;for(const p of path){n[p.k]??={p,c:{}};n=n[p.k].c}});
  const rnd=n=>"<ul>"+Object.values(n).map(({p,c})=>`<li><span data-q="${p.q}">${p.lab}</span>${!p.leaf&&p.sci!=p.lab?` <span class="sci" data-q="${p.q}">${p.sci}</span>`:""}${Object.keys(c).length?rnd(c):""}</li>`).join("")+"</ul>";
  el.innerHTML=rnd(T);el.querySelectorAll("[data-q]").forEach(s=>s.onclick=()=>setQ(s.dataset.q));}
// viewer
const V=document.getElementById("viewer"),VI=document.getElementById("vimg");let z=1,x=0,y=0,fit=1,drag=null,hiS=0,hiOn=false,hiReq=false;
const VH=document.getElementById("vhi");
function maybeHi(){if(hiOn||hiReq||!cur)return;const m=media[cur.mids[mi]];if(!m||!m.zen||!m.zen.iiif)return;hiReq=true;const want=cur.mids[mi];VH.textContent=UI[L].hiLoad;VH.style.display="block";const im=new Image();im.onload=()=>{if(cur&&cur.mids[mi]==want){hiS=im.naturalWidth/VI.naturalWidth;VI.src=im.src}};im.onerror=()=>{VH.style.display="none"};im.src=`https://zenodo.org/api/iiif/record:${m.zen.r}:${encodeURIComponent(m.zen.f)}/full/max/0/default.jpg`}
const ap=()=>VI.style.transform=`translate(${x}px,${y}px) scale(${z})`;
function doFit(){const W=V.clientWidth,Hh=V.clientHeight,w=VI.naturalWidth,h=VI.naturalHeight;fit=Math.min(W/w,Hh/h);z=fit;x=(W-w*z)/2;y=(Hh-h*z)/2;ap()}
function zoomAt(f,cx,cy){const nz=Math.min(Math.max(z*f,fit),Math.max(fit*8,hiOn?2:0));x=cx-(cx-x)*nz/z;y=cy-(cy-y)*nz/z;z=nz;ap();if(nz>Math.min(1,fit*2))maybeHi()}
V.addEventListener("wheel",e=>{e.preventDefault();const r=V.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});
V.addEventListener("pointerdown",e=>{if(e.target.tagName=="BUTTON")return;drag=[e.clientX-x,e.clientY-y];V.setPointerCapture(e.pointerId);V.style.cursor="grabbing"});
V.addEventListener("pointermove",e=>{if(drag){x=e.clientX-drag[0];y=e.clientY-drag[1];ap()}});
V.addEventListener("pointerup",()=>{drag=null;V.style.cursor="grab"});
V.addEventListener("dblclick",e=>{const r=V.getBoundingClientRect();zoomAt(2,e.clientX-r.left,e.clientY-r.top)});
document.getElementById("zin").onclick=()=>zoomAt(1.4,V.clientWidth/2,V.clientHeight/2);document.getElementById("zout").onclick=()=>zoomAt(1/1.4,V.clientWidth/2,V.clientHeight/2);document.getElementById("zfit").onclick=doFit;
VI.onload=()=>{if(hiS){z/=hiS;fit/=hiS;hiS=0;hiOn=true;ap();VH.textContent="✓ "+UI[L].hiDone;setTimeout(()=>VH.style.display="none",2500);return}doFit()};window.addEventListener("resize",()=>{if(cur)doFit()});
function showMedia(i){mi=i;hiOn=false;hiReq=false;hiS=0;VH.style.display="none";VI.src=D.images[cur.mids[i]];document.querySelectorAll(".strip img").forEach((im,j)=>im.classList.toggle("on",j==i));fillInfo()}
function openRec(id){cur=D.occurrences.find(o=>o.occurrenceID==id);document.getElementById("modal").style.display="block";document.body.style.overflow="hidden";
  document.getElementById("strip").innerHTML=cur.mids.length>1?cur.mids.map((m,i)=>`<img src="${D.images[m]}" data-i="${i}">`).join(""):"";
  document.getElementById("strip").style.display=cur.mids.length>1?"flex":"none";
  document.querySelectorAll(".strip img").forEach(im=>im.onclick=()=>showMedia(+im.dataset.i));showMedia(0);}
function closeRec(){document.getElementById("modal").style.display="none";document.body.style.overflow="";cur=null}
document.getElementById("close").onclick=closeRec;document.addEventListener("keydown",e=>{if(e.key=="Escape"&&cur)closeRec()});
function fillInfo(){const u=UI[L],o=cur,m=media[o.mids[mi]];const other=L=="es"?o.vernacularName_en:o.vernacularName_es;
  const crumbs=!o.acceptedNameUsage?`<a data-q="${o.category_en}">${L=="es"?o.category_es:o.category_en}</a>`:[["kingdom",o.kingdom],["class",o.class],["order",o.order],["family",o.family],["genus",o.genus],["species",o.acceptedNameUsage]]
   .map(([r,v])=>`<a data-q="${v}" title="${u.rank[r]||r}">${["genus","species"].includes(r)?"<i>"+v+"</i>":v}${hl(v,L)&&hl(v,L)!=v?" ("+hl(v,L)+")":""}</a>`).filter((x,i,a)=>a.indexOf(x)==i).join(" › ");
  const tr=s=>({male:u.male,female:u.female,adult:u.adult}[s]||s);
  const assoc=o.assoc.map(a=>`${(D.assocNames[a]||[a,a])[L=="es"?1:0]} (<i>${a}</i>)`).join(", ");
  const rows=Object.entries(o).filter(([k,v])=>!["mids","assoc","nameText","blobN","blobH","blobC","caption_en","caption_es","subjectPart_es","phenology_es","reproductiveCondition_es","category_es","keywords_es"].includes(k)&&v!==""&&v!==null);
  const mrows=Object.entries(m).filter(([k,v])=>!["caption_en","caption_es","occurrenceID"].includes(k)&&v!==""&&v!==null);
  const year=o.eventDate.slice(0,4);
  document.getElementById("info").innerHTML=`<h2>${cn(o)}${o.individualCount>1?" ×"+o.individualCount:""}</h2><div class="alt">${o.scientificName?`<i>${o.scientificName}</i> · `:""}${other}</div>
  <p>${(L=="es"?(m.caption_es||o.caption_es):(m.caption_en||o.caption_en))}</p><div class="crumbs">${crumbs}</div>
  <div class="facts"><span><b>${u.date}</b>${fmtDate(o)}</span><span><b>${u.time}</b>${o.eventDate.slice(11,16)}</span>
  <span><b>${u.where}</b>${D.park} — ${o.locationSensitivity=="withhold location"?u.withheld:((m.locality||o.localityDetail)?(m.locality||o.localityDetail)+((m.locality?m.localityRemarks:o.localityRemarks)?` (${u.fromFile})`:""):u.pending)+(o.locationSensitivity.startsWith("generalise")?"; "+u.generalised:"")}</span>${o.individualCount>1?`<span><b>${u.count}</b>${o.individualCount}</span>`:""}
  ${o.sex?`<span><b>${u.sex}</b>${tr(o.sex)}</span>`:""}${o.lifeStage?`<span><b>${u.stage}</b>${tr(o.lifeStage)}</span>`:""}${o.domain=="flora"?`<span><b>${u.part}</b>${L=="es"?o.subjectPart_es:o.subjectPart}</span>`:""}${o.phenology?`<span><b>${u.phen}</b>${L=="es"?o.phenology_es:o.phenology}</span>`:""}${assoc?`<span><b>${u.with}</b>${assoc}</span>`:""}</div>
  ${o.conservationStatus?`<div class="consbox">${o.conservationStatus}</div>`:""}${(()=>{const st=o.identificationVerificationStatus;const [txt,ok]=st.startsWith("suggested")?[u.idnote,0]:st.startsWith("identified")?[u.idPhot,1]:st.startsWith("unidentified")?[u.idUn,0]:[u.idDesc,1];
   return `<div class="idbox" style="${ok?"background:#eef4ea;border-left-color:var(--sage)":""}">${txt} ${o.identificationRemarks}</div>`})()}
  <details><summary>${o.acceptedNameUsage?u.sci:u.det}</summary><table>${rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")}
  <tr><td colspan=2 style="font-weight:600;color:var(--ink);font-family:inherit">${u.exif} ${mi+1}/${o.mids.length}</td></tr>${mrows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table></details>
  <div class="dl">${m.zen?`<a class="zen" href="https://zenodo.org/records/${m.zen.r}/files/${encodeURIComponent(m.zen.f)}?download=1" target="_blank" rel="noopener">⬇ ${u.orig} (${m.zen.f.split(".").pop().toUpperCase()}, ${(m.zen.s/1e6).toFixed(1)} MB)</a><br>`:""}${o.zenodoDOI?`<a class="zen" href="https://doi.org/${o.zenodoDOI}" target="_blank" rel="noopener">⬇ ${u.zen}</a> · `:""}${o.taxonID_GBIF?`<a href="https://www.gbif.org/species/${o.taxonID_GBIF}" target="_blank" rel="noopener">${u.gbif}</a> · `:""}<b>${u.cite}:</b> Lomax, Geoffrey (${year}). ${o.acceptedNameUsage?`<i>${o.acceptedNameUsage}</i>`:o.vernacularName_en}, ${D.park}. ${o.zenodoDOI?`Anza Borrego Natural and Human History. ${u.zcite}. https://doi.org/${o.zenodoDOI}`:`${D.park.split(" ")[0]} Natural History Archive, ${m.identifier}`}.</div>`;
  document.querySelectorAll("#info [data-q]").forEach(a=>a.onclick=()=>{closeRec();setQ(a.dataset.q)});}
function applyLang(){const u=UI[L];document.documentElement.lang=L;["title","sub","banner","browse","month","placeF","part","filters","cons","foot"].forEach(k=>{const e=document.getElementById("t_"+k);if(e)e.textContent=u[k]});
  document.getElementById("reset").textContent=u.reset;q.placeholder=u.ph;document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l==L));tree();render();if(cur)fillInfo();}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;applyLang()});
document.getElementById("fcons").onchange=render;document.getElementById("reset").onclick=()=>{q.value="";month=null;place=null;part=null;document.getElementById("fcons").checked=false;render()};
applyLang();
</script></body></html>
